{% load static %}
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Bitácora · Blog{% endblock %}</title><link rel="stylesheet" href="{% static 'blog/style.css' %}"></head>
<body><header><nav aria-label="Principal"><a class="brand" href="{% url 'post_list' %}">Bitácora<span>Ideas que merecen una página.</span></a><div class="navlinks">{% if user.is_authenticated %}<a href="{% url 'post_create' %}">Escribir</a><a href="{% url 'profile' %}">Mi perfil</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet">Salir</button></form>{% else %}<a href="{% url 'login' %}">Ingresar</a><a class="button" href="{% url 'register' %}">Crear cuenta</a>{% endif %}</div></nav></header>
<main>{% block content %}{% endblock %}</main><footer>Bitácora · Proyecto final de Python y Django</footer></body></html>
